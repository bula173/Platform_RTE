' PlantUML Configuration for RteFramework
'
' Usage: plantuml -c plantuml.cfg <diagram.puml>

' Styling
skinparam backgroundColor #FEFEFE
skinparam defaultFontName "Courier"
skinparam defaultFontSize 11
skinparam defaultFontColor #333333

' Component styling
skinparam component {
    BackgroundColor #E1F5FE
    BorderColor #01579B
    ArrowColor #01579B
}

' Sequence diagram styling
skinparam sequence {
    ArrowColor #01579B
    ActorBackgroundColor #E1F5FE
    ActorBorderColor #01579B
    ParticipantBackgroundColor #E1F5FE
    ParticipantBorderColor #01579B
    LifeLineBorderColor #01579B
}

' State machine styling
skinparam state {
    BackgroundColor #E1F5FE
    BorderColor #01579B
    ArrowColor #01579B
}

' Package styling
skinparam package {
    BackgroundColor #F3E5F5
    BorderColor #4A148C
}

' Database styling
skinparam database {
    BackgroundColor #FFF3E0
    BorderColor #E65100
}

' Monochrome (for printing)
' skinparam monochrome true

' Output settings
!define DIRECTION top to bottom direction
' DIRECTION = left to right direction
' DIRECTION = top to bottom direction
