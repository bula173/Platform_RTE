name: Generate Documentation

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'include/safeapi/**/*.h'
      - 'include/safeapi/**/*.md'
      - 'Doxyfile'
      - '.github/workflows/generate-docs.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'include/safeapi/**/*.h'
      - 'include/safeapi/**/*.md'
      - 'Doxyfile'

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          doxygen --version

      - name: Generate Documentation
        run: |
          doxygen Doxyfile
          echo "Documentation generated successfully"
          ls -lah docs/api/html/ | head -20

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-documentation
          path: docs/api/html/
          retention-days: 30

      # Deploy step removed: this project's docs are now published as a subpage of the single
      # unified GitHub Pages site on the top-level bula173/SAPI repo, not this project's own
      # gh-pages branch — see docs.yml's own note and the root repo's .github/workflows/docs.yml.

      - name: Comment on PR with doc link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 **Documentation Preview**\n\nHTML documentation generated. Download the artifact to review:\n- Artifact name: `html-documentation`\n- Format: Doxygen-generated HTML\n- Status pages: Check the "Artifacts" tab'
            })
