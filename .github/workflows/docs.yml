name: Build & Deploy Documentation

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/coverage.sh'
      - 'Doxyfile'
      - 'README.dox'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/coverage.sh'
      - 'Doxyfile'
      - 'README.dox'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  build-docs:
    name: Build Documentation with Doxygen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Verify Doxygen installation
        run: doxygen --version

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile
        working-directory: ${{ github.workspace }}

      - name: Verify documentation output
        run: |
          echo "Checking if HTML was generated..."
          if [ -d "docs/api/html" ]; then
            echo "✓ HTML documentation generated"
            ls -la docs/api/html/ | head -20
          else
            echo "✗ HTML documentation NOT generated"
            exit 1
          fi

      - name: Install coverage toolchain
        run: |
          sudo apt-get install -y cmake build-essential
          pip install --user gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate coverage report
        run: |
          gcovr --version
          # --no-fail: this page should always publish something, even on
          # a build with <100% coverage - the pass/fail gate itself is
          # enforced by CI's own test job, not by whether this subpage
          # exists.
          ./scripts/coverage.sh --no-fail
        working-directory: ${{ github.workspace }}

      - name: Publish coverage report as a Doxygen subpage
        run: |
          mkdir -p docs/api/html/coverage
          cp -r build-coverage/coverage/. docs/api/html/coverage/
          echo "Coverage report copied to docs/api/html/coverage/"
          ls -la docs/api/html/coverage/ | head -20

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-documentation
          path: docs/api/html/
          retention-days: 7

  # This project's docs no longer deploy to their own separate GitHub Pages site — they are
  # published as a subpage of the single unified site on the top-level bula173/RBC_Template repo instead
  # (its own .github/workflows/docs.yml checks out this repo as a submodule and runs `doxygen
  # Doxyfile` here, same as this workflow's build-docs job does). build-docs above still runs on
  # every push/PR as a CI check and artifact; only the separate deploy-pages step was removed.

  validate-docs:
    name: Validate Documentation Quality
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: doxygen-documentation
          path: ./docs-output

      - name: Check for broken links in HTML
        run: |
          echo "Checking for common documentation issues..."

          # Check if index.html exists
          if [ ! -f "docs-output/index.html" ]; then
            echo "✗ index.html not found"
            exit 1
          fi

          # Count generated files
          html_count=$(find docs-output -name "*.html" | wc -l)
          echo "✓ Generated $html_count HTML files"

          # Look for undocumented warnings
          if grep -r "warning" docs-output 2>/dev/null | grep -q "undocumented"; then
            echo "⚠ Found undocumented warnings in docs"
          fi

          # Coverage subpage
          if [ ! -f "docs-output/coverage/index.html" ]; then
            echo "✗ coverage/index.html not found"
            exit 1
          fi
          echo "✓ Coverage subpage present"

      - name: Generate documentation summary
        run: |
          echo "# Documentation Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "- HTML files: $(find docs-output -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- CSS files: $(find docs-output -name '*.css' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- JS files: $(find docs-output -name '*.js' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Documentation Location" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Pages: Will be available after deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage report subpage: \`<pages-url>/coverage/index.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: Check 'doxygen-documentation' in workflow artifacts" >> $GITHUB_STEP_SUMMARY
