name: Release Build & Quality Gate

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.2.0, etc.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang cppcheck doxygen graphviz

      - name: Build with CI preset (strict)
        run: cmake --preset ci && cmake --build --preset ci

      - name: Run all tests
        run: ctest --preset ci --output-on-failure

      - name: Run MISRA analysis
        run: cmake --build build --target cppcheck
        continue-on-error: false

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Verify documentation
        run: |
          if [ ! -d "docs/api/html" ]; then
            echo "✗ Documentation generation failed"
            exit 1
          fi
          echo "✓ Documentation generated successfully"

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: quality-gate

    strategy:
      matrix:
        preset: [ release, linux-release ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }} && cmake --build --preset ${{ matrix.preset }}

      - name: Create artifact package
        run: |
          mkdir -p artifacts/${{ matrix.preset }}/lib
          mkdir -p artifacts/${{ matrix.preset }}/include
          cp build/src/*/*.a artifacts/${{ matrix.preset }}/lib/ 2>/dev/null || true
          cp -r include/safeapi artifacts/${{ matrix.preset }}/include/
          ls -la artifacts/${{ matrix.preset }}/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.preset }}
          path: artifacts/${{ matrix.preset }}/

  # documentation-release (Pages deploy) removed: this project's docs are now published as a
  # subpage of the single unified GitHub Pages site on the top-level bula173/SAPI repo instead.
  # Doc generation still gates the release via quality-gate's own "Generate documentation" /
  # "Verify documentation" steps above.

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          echo "# Release Notes" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Version: ${{ github.ref_name }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Changes" >> RELEASE_NOTES.md
          git log --oneline $(git describe --tags --abbrev=0)..HEAD >> RELEASE_NOTES.md 2>/dev/null || echo "First release" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [ quality-gate, build-artifacts ]

    steps:
      - name: Release Complete
        run: |
          echo "# Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quality Gate: ${{ needs.quality-gate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "## Build Artifacts: ${{ needs.build-artifacts.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All release steps completed" >> $GITHUB_STEP_SUMMARY
